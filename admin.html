<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الإدارة | BRAVEN</title>
<link rel="stylesheet" href="styles.css">
<style>
.admin-wrap{max-width:1200px;margin:30px auto;padding:0 20px 60px}.admin-grid{display:grid;grid-template-columns:380px 1fr;gap:22px}.admin-panel{background:#fff;border:1px solid #e5ddd5;border-radius:18px;padding:22px;box-shadow:0 8px 25px #00000008}.admin-panel h1,.admin-panel h2{margin-top:0}.admin-panel label{display:block;font-weight:700;margin:12px 0 7px}.admin-panel input,.admin-panel select{width:100%;padding:12px;border:1px solid #ddd3c9;border-radius:10px;background:#faf8f5;font:inherit}.admin-actions{display:flex;gap:10px;margin-top:16px}.admin-btn{border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:700}.admin-primary{background:#171717;color:#fff}.admin-light{background:#eee8e1;color:#171717}.admin-list{display:grid;gap:12px}.admin-item{display:grid;grid-template-columns:95px 1fr auto;gap:14px;align-items:center;padding:12px;background:#faf8f5;border:1px solid #e7ded5;border-radius:14px}.admin-item img{width:95px;height:95px;object-fit:cover;border-radius:10px;background:#eee}.admin-item h3{margin:0 0 6px}.admin-item p{margin:4px 0;color:#746d65}.admin-danger{background:#fff0ee;color:#a83b31}.image-help{font-size:.82rem;color:#777;line-height:1.6;margin-top:-7px}.preview{width:100%;height:170px;object-fit:cover;border-radius:12px;margin-top:10px;display:none;background:#eee}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px}.admin-top a{text-decoration:none;color:inherit}@media(max-width:850px){.admin-grid{grid-template-columns:1fr}.admin-item{grid-template-columns:75px 1fr}.admin-item .admin-actions{grid-column:1/-1;display:flex;gap:8px}.admin-item img{width:75px;height:75px}}
</style>
</head>
<body>
<header class="header"><a class="logo" href="index.html">♧ BRAVEN<small>ADMIN PANEL</small></a><div class="actions"><a href="index.html">الرئيسية</a></div></header>
<main class="admin-wrap">
<div class="admin-top"><div><h1>لوحة الإدارة</h1><p>إضافة وتعديل المنتجات والصور</p></div><button class="admin-btn admin-light" id="resetDemo">استعادة التجريبي</button></div>
<div class="admin-grid">
<section class="admin-panel"><h2>إضافة منتج</h2><form id="productForm"><input type="hidden" id="productId">
<label for="name">اسم المنتج</label><input id="name" required placeholder="مثال: تيشيرت BRAVEN">
<label for="category">الفئة</label><select id="category"><option>رجالي</option><option>نسائي</option><option>أطفال</option><option>تصاميم</option><option>كاجوال</option><option>هوديز</option><option>إكسسوارات</option></select>
<label for="price">السعر</label><input id="price" type="number" min="1" required>
<label for="oldPrice">السعر القديم (اختياري)</label><input id="oldPrice" type="number" min="0" value="0">
<label for="imageUrl">رابط الصورة (اختياري)</label><input id="imageUrl" type="url" placeholder="https://example.com/photo.jpg"><div class="image-help">أو اختر صورة من جهازك. اختيار الملف يحفظ الصورة داخل المتصفح، ولا تحتاج رابطًا.</div>
<label for="imageFile">اختيار صورة من الجهاز</label><input id="imageFile" type="file" accept="image/*"><img id="preview" class="preview" alt="معاينة الصورة">
<div class="admin-actions"><button class="admin-btn admin-primary" type="submit">حفظ المنتج</button><button class="admin-btn admin-light" type="button" id="clearForm">مسح</button></div></form></section>
<section class="admin-panel"><h2>المنتجات</h2><div id="productList" class="admin-list"></div></section>
</div></main>
<script>
const KEY='braven_products';
const fallback='https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=900&q=80';
const demo=[{id:1,name:'تيشيرت Dream Big',category:'رجالي',price:299,oldPrice:349,image:fallback},{id:2,name:'تيشيرت Samurai',category:'تصاميم',price:279,oldPrice:0,image:fallback}];
const $=id=>document.getElementById(id);
function products(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function save(x){localStorage.setItem(KEY,JSON.stringify(x));}
function render(){const list=$('productList'),items=products();if(!items.length){list.innerHTML='<p>لا توجد منتجات.</p>';return}list.innerHTML=items.map(p=>`<article class="admin-item"><img src="${p.image||fallback}" alt="${p.name}"><div><h3>${p.name}</h3><p>${p.category} · ${p.price} ج.م</p>${p.oldPrice?`<p>قديم: ${p.oldPrice} ج.م</p>`:''}</div><div class="admin-actions"><button class="admin-btn admin-light" data-edit="${p.id}">تعديل</button><button class="admin-btn admin-danger" data-delete="${p.id}">حذف</button></div></article>`).join('')}
function clearForm(){$('productId').value='';$('name').value='';$('category').value='رجالي';$('price').value='';$('oldPrice').value=0;$('imageUrl').value='';$('imageFile').value='';$('preview').src='';$('preview').style.display='none'}
$('imageFile').addEventListener('change',()=>{const file=$('imageFile').files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{$('preview').src=reader.result;$('preview').style.display='block'};reader.readAsDataURL(file)});
$('imageUrl').addEventListener('input',()=>{if($('imageUrl').value){$('preview').src=$('imageUrl').value;$('preview').style.display='block'}});
$('productForm').addEventListener('submit',e=>{e.preventDefault();const file=$('imageFile').files[0];const finish=image=>{const item={id:Number($('productId').value)||Date.now(),name:$('name').value.trim(),category:$('category').value,price:Number($('price').value),oldPrice:Number($('oldPrice').value)||0,image:image||fallback};const all=products(),i=all.findIndex(p=>p.id===item.id);if(i<0)all.unshift(item);else all[i]=item;save(all);render();clearForm();alert('تم حفظ المنتج بنجاح')};if(file){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file)}else finish($('imageUrl').value.trim())});
$('clearForm').onclick=clearForm;
$('productList').addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]'),all=products();if(edit){const p=all.find(x=>x.id==edit.dataset.edit);if(!p)return;$('productId').value=p.id;$('name').value=p.name;$('category').value=p.category;$('price').value=p.price;$('oldPrice').value=p.oldPrice||0;$('imageUrl').value=p.image&&p.image.startsWith('data:')?'':p.image||'';$('preview').src=p.image||fallback;$('preview').style.display='block';scrollTo({top:0,behavior:'smooth'})}if(del&&confirm('حذف المنتج؟')){save(all.filter(x=>x.id!=del.dataset.delete));render()}});
$('resetDemo').onclick=()=>{if(confirm('استعادة المنتجات التجريبية؟')){save(demo);render()}};
if(!products().length)save(demo);render();
</script>
</body></html>
