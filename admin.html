<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة الإدارة | BRAVEN</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-wrap{max-width:1200px;margin:30px auto;padding:0 20px 60px}.admin-grid{display:grid;grid-template-columns:380px 1fr;gap:22px}.admin-panel{background:#fff;border:1px solid #e5ddd5;border-radius:18px;padding:22px}.admin-panel h2{margin-top:0}.admin-panel label{display:block;margin:12px 0 6px;font-weight:700}.admin-panel input,.admin-panel select{width:100%;padding:11px;border:1px solid #ddd4cb;border-radius:10px;background:#fff}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.admin-top h1{margin:0 0 6px}.admin-top p{margin:0;color:#756d67}.admin-btn{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700}.admin-primary{background:#111;color:#fff}.admin-light{background:#f1ebe5;color:#111}.admin-actions{display:flex;gap:10px;margin-top:16px}.admin-list{display:grid;gap:12px}.admin-item,.order-item{border:1px solid #e7ded5;border-radius:14px;padding:14px;background:#fffaf6}.admin-item{display:flex;justify-content:space-between;align-items:center;gap:12px}.admin-item img{width:70px;height:70px;object-fit:cover;border-radius:10px}.admin-item-info{flex:1}.admin-item-actions{display:flex;gap:8px;flex-wrap:wrap}.admin-item-actions button{border:0;border-radius:8px;padding:8px 10px;cursor:pointer}.edit{background:#eee;color:#111}.delete{background:#f7dedb;color:#8a2d2d}.preview{display:none;width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:10px}.image-help{font-size:.78rem;color:#777;margin-top:5px}.orders-panel{margin-top:22px}.orders-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.order-item{margin-top:12px;background:#fff;border:1px solid #efe4db}.order-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#665e58;align-items:center}.order-products{margin:10px 0 0;padding-right:20px}.order-status{padding:6px 10px;border-radius:999px;background:#eee7df;font-size:.85rem}.order-status.done{background:#dff1e5;color:#28764d}.order-status.cancelled{background:#f6dede;color:#9b3333}.order-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.order-controls button{border:0;border-radius:8px;padding:8px 10px;cursor:pointer}.customer-info{margin:10px 0 0; padding:10px 12px; background:#fffaf5; border:1px dashed #e3d7cb; border-radius:10px; color:#514b46; line-height:1.8}.empty{padding:20px;text-align:center;border:1px dashed #d8cfc5;border-radius:12px;color:#736c67;background:#fffaf5}@media(max-width:900px){.admin-grid{grid-template-columns:1fr}.admin-top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<header class="header"><a class="logo" href="index.html">♧ BRAVEN<small>ADMIN PANEL</small></a><div class="actions"><a href="index.html">الرئيسية</a></div></header>
<main class="admin-wrap">
<div class="admin-top"><div><h1>لوحة الإدارة</h1><p>إضافة المنتجات وإدارة الأسعار والمخزون والطلبات</p></div><button class="admin-btn admin-light" id="resetDemo" type="button">استعادة المنتجات التجريبية</button></div>
<div class="admin-grid">
<section class="admin-panel"><h2>إضافة أو تعديل منتج</h2><form id="productForm"><input type="hidden" id="productId">
<label for="name">اسم المنتج</label><input id="name" required placeholder="مثال: تيشيرت BRAVEN">
<label for="category">الفئة</label><select id="category"><option>رجالي</option><option>نسائي</option><option>أطفال</option><option>تصاميم</option><option>كاجوال</option><option>هوديز</option><option>إكسسوارات</option></select>
<label for="price">السعر</label><input id="price" type="number" min="1" required>
<label for="oldPrice">السعر القديم (اختياري)</label><input id="oldPrice" type="number" min="0" value="0">
<label for="stock">المخزون</label><input id="stock" type="number" min="0" step="1" value="0" required>
<label for="imageUrl">رابط الصورة (اختياري)</label><input id="imageUrl" type="url" placeholder="https://example.com/photo.jpg">
<label for="imageFile">اختيار صورة من الجهاز</label><input id="imageFile" type="file" accept="image/*"><img id="preview" class="preview" alt="معاينة الصورة">
<div class="admin-actions"><button class="admin-btn admin-primary" type="submit">حفظ المنتج</button><button class="admin-btn admin-light" type="button" id="clearForm">مسح</button></div></form></section>
<section class="admin-panel"><h2>المنتجات والمخزون</h2><div id="productList" class="admin-list"></div></section>
</div>
<section class="admin-panel orders-panel"><div class="orders-head"><div><h2>الطلبات</h2><p>الطلبات المحفوظة من عمليات الشراء على هذا المتصفح.</p></div><button class="admin-btn admin-light" id="clearOrders" type="button">مسح الطلبات</button></div><div id="ordersList"></div></section>
</main>
<script>
const PRODUCTS_KEY='braven_products';
const ORDERS_KEY='braven_orders';
const fallback='https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=900&q=80';
const $=id=>document.getElementById(id);
const demo=[{id:1,name:'تيشيرت Dream Big',category:'رجالي',price:299,oldPrice:349,stock:10,image:fallback},{id:2,name:'تيشيرت Samurai',category:'تصاميم',price:279,oldPrice:0,stock:10,image:fallback},{id:3,name:'تيشيرت Adventure',category:'كاجوال',price:319,oldPrice:0,stock:10,image:fallback},{id:4,name:'تيشيرت Good Vibes',category:'رجالي',price:299,oldPrice:349,stock:10,image:fallback},{id:5,name:'تيشيرت Anime',category:'تصاميم',price:289,oldPrice:0,stock:10,image:fallback},{id:6,name:'تيشيرت Butterfly',category:'نسائي',price:279,oldPrice:0,stock:10,image:fallback},{id:7,name:'تيشيرت Kids',category:'أطفال',price:229,oldPrice:0,stock:10,image:fallback},{id:8,name:'هودي Street',category:'هوديز',price:449,oldPrice:499,stock:10,image:fallback}];
function products(){try{const x=JSON.parse(localStorage.getItem(PRODUCTS_KEY)||'[]');return Array.isArray(x)?x.map(p=>({...p,stock:Math.max(0,Math.floor(Number(p.stock||0)))})):[]}catch(e){return[]}}
function saveProducts(x){localStorage.setItem(PRODUCTS_KEY,JSON.stringify(x))}
function orders(){try{const x=JSON.parse(localStorage.getItem(ORDERS_KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function saveOrders(x){localStorage.setItem(ORDERS_KEY,JSON.stringify(x))}
function renderProducts(){const list=$('productList'),items=products();if(!items.length){list.innerHTML='<p>لا توجد منتجات.</p>';return}list.innerHTML=items.map(p=>`<article class="admin-item"><img src="${p.image||fallback}" alt="${p.name}" onerror="this.src='${fallback}'"><div class="admin-item-info"><b>${p.name}</b><div>${p.category} · ${p.price} ج.م · المخزون: ${p.stock}</div></div><div class="admin-item-actions"><button class="edit" data-edit="${p.id}" type="button">تعديل</button><button class="delete" data-delete="${p.id}" type="button">حذف</button></div></article>`).join('')}
function renderOrders(){const list=$('ordersList'),items=orders();if(!items.length){list.innerHTML='<div class="empty">لا توجد طلبات حتى الآن.</div>';return};list.innerHTML=items.slice().reverse().map(o=>{const status=o.status||'جديد';const customer=o.customer||{};const customerName=customer.name||'غير محدد';const customerPhone=customer.phone||'غير محدد';const customerAddress=customer.address||'غير محدد';const productsHtml=(o.items||[]).map(i=>`<li>${i.name||'منتج'} × ${Number(i.qty||1)} — ${Number(i.price||0)*Number(i.qty||1)} ج.م</li>`).join('');return `<article class="order-item"><div class="order-meta"><strong>طلب #${o.id}</strong><span>${o.date||''}</span><span class="order-status ${status==='مكتمل'?'done':status==='ملغي'?'cancelled':''}">${status}</span><strong>${o.total||0} ج.م</strong></div><div class="customer-info"><strong>العميل:</strong> ${customerName}<br><strong>الهاتف:</strong> ${customerPhone}<br><strong>العنوان:</strong> ${customerAddress}</div><ul class="order-products">${productsHtml}</ul><div class="order-controls"><button class="admin-btn admin-light" data-status="قيد التجهيز" data-order="${o.id}" type="button">قيد التجهيز</button><button class="admin-btn admin-light" data-status="مكتمل" data-order="${o.id}" type="button">مكتمل</button><button class="admin-btn admin-light" data-status="ملغي" data-order="${o.id}" type="button">ملغي</button></div></article>`}).join('')}
function clearForm(){$('productId').value='';$('name').value='';$('category').value='رجالي';$('price').value='';$('oldPrice').value=0;$('stock').value=0;$('imageUrl').value='';$('imageFile').value='';$('preview').style.display='none'}
$('imageFile').addEventListener('change',()=>{const file=$('imageFile').files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{$('preview').src=reader.result;$('preview').style.display='block'};reader.readAsDataURL(file)});
$('imageUrl').addEventListener('input',()=>{if($('imageUrl').value){$('preview').src=$('imageUrl').value;$('preview').style.display='block'}});
$('productForm').addEventListener('submit',e=>{e.preventDefault();const file=$('imageFile').files[0];const finish=image=>{const all=products();const item={id:Number($('productId').value)||Date.now(),name:$('name').value.trim(),category:$('category').value,price:Number($('price').value),oldPrice:Number($('oldPrice').value)||0,stock:Math.max(0,Math.floor(Number($('stock').value)||0)),image:image||fallback};const index=all.findIndex(p=>Number(p.id)===item.id);if(index>=0)all[index]=item;else all.push(item);saveProducts(all);renderProducts();clearForm()};if(file){const reader=new FileReader();reader.onload=()=>finish(reader.result);reader.readAsDataURL(file)}else finish($('imageUrl').value.trim())});
$('clearForm').onclick=clearForm;
$('productList').addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]'),all=products();if(edit){const p=all.find(x=>Number(x.id)===Number(edit.dataset.edit));if(!p)return;$('productId').value=p.id;$('name').value=p.name;$('category').value=p.category;$('price').value=p.price;$('oldPrice').value=p.oldPrice||0;$('stock').value=p.stock||0;$('imageUrl').value=p.image&&p.image!==fallback?p.image:'';$('preview').src=p.image||fallback;$('preview').style.display='block';window.scrollTo({top:0,behavior:'smooth'})}if(del&&confirm('حذف هذا المنتج؟')){saveProducts(all.filter(x=>Number(x.id)!==Number(del.dataset.delete)));renderProducts()}});
$('ordersList').addEventListener('click',e=>{const button=e.target.closest('[data-status]');if(!button)return;const all=orders(),order=all.find(o=>String(o.id)===String(button.dataset.order));if(order){order.status=button.dataset.status;saveOrders(all);renderOrders()}});
$('clearOrders').onclick=()=>{if(confirm('مسح سجل الطلبات؟')){saveOrders([]);renderOrders()}};
$('resetDemo').onclick=()=>{if(confirm('استعادة المنتجات التجريبية؟')){saveProducts(demo);renderProducts()}};
if(!products().length)saveProducts(demo);renderProducts();renderOrders();
</script>
</body></html>
