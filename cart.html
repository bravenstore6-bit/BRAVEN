<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>السلة | BRAVEN</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f7f4f1;
      color: #171515;
    }
    a { color: inherit; text-decoration: none; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 30px;
      background: #101010;
      color: #fff;
    }
    .logo {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .logo small { display: block; font-size: 0.64rem; letter-spacing: 0.12em; opacity: 0.72; }
    .wrap {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px 60px;
    }
    .panel {
      background: #fff;
      border: 1px solid #e3dcd3;
      border-radius: 18px;
      padding: 22px;
    }
    .customer-box {
      background: #fffaf5;
      border: 1px solid #e8d8cd;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .customer-box h3 {
      margin: 0 0 12px;
      font-size: 1.1rem;
    }
    .customer-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 12px;
    }
    .customer-grid input {
      width: 100%;
      border: 1px solid #ddd1c8;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
    }
    .cart-item {
      display: grid;
      grid-template-columns: 110px 1fr auto;
      gap: 16px;
      padding: 14px;
      background: #faf6f2;
      border: 1px solid #e7ded5;
      border-radius: 14px;
      margin-bottom: 12px;
      align-items: center;
    }
    .cart-item img { width: 110px; height: 110px; object-fit: cover; border-radius: 12px; }
    .qty-box {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #ded1c6;
      border-radius: 12px;
      padding: 6px 10px;
      margin-top: 8px;
    }
    .qty-box button {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #ece2d8;
    }
    .checkout-btn {
      border: none;
      border-radius: 12px;
      padding: 12px 22px;
      background: #111;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .empty {
      padding: 28px;
      text-align: center;
      border: 1px dashed #dcd1c6;
      border-radius: 14px;
      background: #fffaf5;
      color: #726a64;
    }
    @media (max-width: 700px) {
      .customer-grid { grid-template-columns: 1fr; }
      .cart-item { grid-template-columns: 90px 1fr; }
      .summary { flex-direction: column; gap: 12px; align-items: stretch; }
    }
  </style>
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html">♧ BRAVEN<small>CART</small></a>
    <a href="index.html">العودة للمتجر</a>
  </header>

  <main class="wrap">
    <section class="panel">
      <h2>السلة</h2>

      <div class="customer-box">
        <h3>بيانات العميل</h3>
        <div class="customer-grid">
          <input id="customerName" type="text" placeholder="الاسم الكامل" />
          <input id="customerPhone" type="tel" placeholder="رقم الهاتف" />
          <input id="customerAddress" type="text" placeholder="العنوان" />
        </div>
      </div>

      <div id="cartList"></div>
      <div class="summary">
        <div><strong id="totalPrice">0 ج.م</strong></div>
        <button class="checkout-btn" id="checkoutBtn" type="button">إتمام الشراء</button>
      </div>
    </section>
  </main>

  <script>
    const PRODUCTS_KEY = 'braven_products';
    const CART_KEY = 'braven_cart';
    const ORDERS_KEY = 'braven_orders';
    const fallbackImage = 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=900&q=80';

    function readStorage(key, fallback) {
      try {
        const value = JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback));
        return value;
      } catch (error) {
        return fallback;
      }
    }

    function getProducts() {
      const products = readStorage(PRODUCTS_KEY, []);
      return Array.isArray(products) ? products : [];
    }

    function saveProducts(products) {
      localStorage.setItem(PRODUCTS_KEY, JSON.stringify(products));
    }

    function getCart() {
      const cart = readStorage(CART_KEY, []);
      if (!Array.isArray(cart)) return [];

      return cart
        .map(item => {
          if (typeof item === 'number') return { id: Number(item), qty: 1 };
          if (item && typeof item === 'object') {
            const id = Number(item.id);
            const qty = Number(item.qty || 1);
            return Number.isFinite(id) ? { id, qty: qty > 0 ? qty : 1 } : null;
          }
          return null;
        })
        .filter(Boolean);
    }

    function saveCart(cart) {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
    }

    function getOrders() {
      const orders = readStorage(ORDERS_KEY, []);
      return Array.isArray(orders) ? orders : [];
    }

    function saveOrders(orders) {
      localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
    }

    function getCustomerData() {
      return {
        name: document.getElementById('customerName').value.trim() || 'غير محدد',
        phone: document.getElementById('customerPhone').value.trim() || 'غير محدد',
        address: document.getElementById('customerAddress').value.trim() || 'غير محدد'
      };
    }

    function clearCustomerData() {
      document.getElementById('customerName').value = '';
      document.getElementById('customerPhone').value = '';
      document.getElementById('customerAddress').value = '';
    }

    function renderCart() {
      const products = getProducts();
      const cart = getCart();
      const list = document.getElementById('cartList');

      if (!cart.length) {
        list.innerHTML = '<div class="empty">السلة فارغة حاليًا.</div>';
        document.getElementById('totalPrice').textContent = '0 ج.م';
        return;
      }

      let total = 0;
      list.innerHTML = cart.map(item => {
        const product = products.find(p => Number(p.id) === Number(item.id));
        if (!product) return '';

        const qty = Number(item.qty || 1);
        const lineTotal = product.price * qty;
        total += lineTotal;

        return `
          <div class="cart-item">
            <img src="${product.image || fallbackImage}" alt="${product.name}" onerror="this.src='${fallbackImage}'" />
            <div>
              <h3 style="margin:0 0 4px;">${product.name}</h3>
              <p style="margin:0; color:#6a615d;">${product.category}</p>
              <div class="qty-box">
                <button data-action="minus" data-id="${product.id}" type="button">-</button>
                <span>${qty}</span>
                <button data-action="plus" data-id="${product.id}" type="button">+</button>
              </div>
            </div>
            <div>
              <strong>${lineTotal} ج.م</strong><br>
              <button type="button" data-action="remove" data-id="${product.id}" style="margin-top:10px; background:#f5e9e3; color:#6b2e2e; width:auto; padding:8px 12px;">حذف</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('totalPrice').textContent = total + ' ج.م';
      document.querySelectorAll('[data-action="plus"]').forEach(button => {
        button.onclick = () => updateQty(Number(button.dataset.id), 1);
      });
      document.querySelectorAll('[data-action="minus"]').forEach(button => {
        button.onclick = () => updateQty(Number(button.dataset.id), -1);
      });
      document.querySelectorAll('[data-action="remove"]').forEach(button => {
        button.onclick = () => removeFromCart(Number(button.dataset.id));
      });
    }

    function updateQty(id, delta) {
      const cart = getCart();
      const products = getProducts();
      const product = products.find(item => Number(item.id) === Number(id));
      const current = cart.find(item => Number(item.id) === Number(id));
      if (!product || !current) return;

      const nextQty = Number(current.qty || 1) + delta;
      if (nextQty <= 0) {
        removeFromCart(id);
        return;
      }

      if (nextQty > product.stock) {
        alert('لا يوجد مخزون كافٍ لهذه الكمية');
        return;
      }

      current.qty = nextQty;
      saveCart(cart);
      renderCart();
      if (window.bravenSync) window.bravenSync();
    }

    function removeFromCart(id) {
      const cart = getCart().filter(item => Number(item.id) !== Number(id));
      saveCart(cart);
      renderCart();
      if (window.bravenSync) window.bravenSync();
    }

    document.getElementById('checkoutBtn').addEventListener('click', function () {
      const cart = getCart();
      const products = getProducts();

      if (!cart.length) {
        alert('السلة فارغة');
        return;
      }

      const customer = getCustomerData();
      if (!customer.name || customer.name === 'غير محدد') {
        alert('يرجى إدخال اسم العميل');
        document.getElementById('customerName').focus();
        return;
      }

      if (!customer.phone || customer.phone === 'غير محدد') {
        alert('يرجى إدخال رقم الهاتف');
        document.getElementById('customerPhone').focus();
        return;
      }

      if (!customer.address || customer.address === 'غير محدد') {
        alert('يرجى إدخال عنوان التوصيل');
        document.getElementById('customerAddress').focus();
        return;
      }

      let ok = true;
      cart.forEach(item => {
        const product = products.find(p => Number(p.id) === Number(item.id));
        if (!product || Number(product.stock) < Number(item.qty || 0)) {
          ok = false;
        }
      });

      if (!ok) {
        alert('بعض المنتجات لم تعد متاحة بالمخزون المطلوب');
        return;
      }

      const lines = [];
      let total = 0;

      cart.forEach(item => {
        const product = products.find(p => Number(p.id) === Number(item.id));
        if (product) {
          const qty = Number(item.qty || 0);
          total += Number(product.price) * qty;
          lines.push({ id: product.id, name: product.name, price: Number(product.price), qty });
          product.stock = Number(product.stock) - qty;
        }
      });

      const order = {
        id: Date.now(),
        date: new Date().toLocaleString('ar-EG'),
        status: 'جديد',
        customer,
        items: lines,
        total
      };

      const orders = getOrders();
      orders.push(order);
      saveProducts(products);
      saveOrders(orders);
      saveCart([]);
      renderCart();
      clearCustomerData();
      if (window.bravenSync) window.bravenSync();
      alert('تم تسجيل الطلب بنجاح');
    });

    renderCart();
    if (window.bravenSync) window.bravenSync();
  </script>
</body>
</html>
