<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>السلة | BRAVEN</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Tahoma, Arial, sans-serif; background: #f7f4f1; color: #171515; }
    a { color: inherit; text-decoration: none; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 18px 30px; background: #101010; color: #fff; }
    .logo { font-size: 2rem; font-weight: 900; letter-spacing: 1px; }
    .logo small { display: block; font-size: .64rem; letter-spacing: .12em; opacity: .72; }
    .wrap { max-width: 1100px; margin: 40px auto; padding: 0 20px 60px; }
    .panel { background: #fff; border: 1px solid #e3dcd3; border-radius: 18px; padding: 22px; }
    .customer-box { background: #fffaf5; border: 1px solid #e8d8cd; border-radius: 14px; padding: 16px; margin-bottom: 18px; }
    .customer-box h3 { margin: 0 0 12px; font-size: 1.1rem; }
    .customer-grid { display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 12px; }
    .customer-grid input { width: 100%; border: 1px solid #ddd1c8; border-radius: 10px; padding: 10px 12px; font-size: .95rem; }
    .cart-item { display: grid; grid-template-columns: 110px 1fr auto; gap: 16px; padding: 14px; background: #faf6f2; border: 1px solid #e7ded5; border-radius: 14px; margin-bottom: 12px; align-items: center; }
    .cart-item img { width: 110px; height: 110px; object-fit: cover; border-radius: 12px; }
    .qty-box { display: inline-flex; align-items: center; gap: 10px; border: 1px solid #ded1c6; border-radius: 12px; padding: 6px 10px; margin-top: 8px; }
    .qty-box button { width: 28px; height: 28px; border: 0; border-radius: 8px; background: #111; color: #fff; font-weight: 700; cursor: pointer; }
    .summary { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 18px; border-top: 1px solid #ece2d8; }
    .checkout-btn { border: 0; border-radius: 12px; padding: 12px 22px; background: #111; color: #fff; font-weight: 700; cursor: pointer; }
    .empty { padding: 28px; text-align: center; border: 1px dashed #dcd1c6; border-radius: 14px; background: #fffaf5; color: #726a64; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 999; }
    .modal-box { width: min(420px, calc(100% - 32px)); background: #f4f2f1; border-radius: 16px; box-shadow: 0 12px 32px rgba(0,0,0,.2); padding: 18px 20px 20px; text-align: center; }
    .modal-box p { margin: 0 0 18px; font-weight: 700; font-size: 1rem; line-height: 1.7; color: #1b1b1b; }
    .modal-box button { background: #3d3d3d; color: #fff; border: 0; border-radius: 999px; padding: 12px 36px; font-weight: 700; cursor: pointer; }
    @media (max-width: 700px) { .customer-grid { grid-template-columns: 1fr; } .cart-item { grid-template-columns: 90px 1fr; } .summary { flex-direction: column; gap: 12px; align-items: stretch; } }
  </style>
</head>
<body>
  <header class="header"><a class="logo" href="index.html">♧ BRAVEN<small>CART</small></a><a href="index.html">العودة للمتجر</a></header>
  <main class="wrap"><section class="panel"><h2>السلة</h2>
    <div class="customer-box"><h3>بيانات العميل</h3><div class="customer-grid"><input id="customerName" type="text" placeholder="الاسم الكامل" /><input id="customerPhone" type="tel" placeholder="رقم الهاتف" /><input id="customerAddress" type="text" placeholder="العنوان" /></div></div>
    <div id="cartList"></div><div class="summary"><div><strong id="totalPrice">0 ج.م</strong></div><button class="checkout-btn" id="checkoutBtn" type="button">إتمام الشراء</button></div>
  </section></main>
  <script>
    const PRODUCTS_KEY='braven_products', CART_KEY='braven_cart', ORDERS_KEY='braven_orders';
    const fallbackImage='https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=900&q=80';
    function readStorage(key, fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch(e){return fallback}}
    function normalizeProduct(product){const rawStock=product.stock??product.quantity??product.inventory??product.qty;const stock=Number(rawStock);return {...product,stock:Number.isFinite(stock)?Math.max(0,Math.floor(stock)):0}}
    function getProducts(){const value=readStorage(PRODUCTS_KEY,[]);return Array.isArray(value)?value.map(normalizeProduct):[]}
    function saveProducts(value){localStorage.setItem(PRODUCTS_KEY,JSON.stringify(value.map(normalizeProduct)))}
    function getCart(){const value=readStorage(CART_KEY,[]);if(!Array.isArray(value))return[];return value.map(item=>{if(typeof item==='number')return{id:Number(item),qty:1};if(item&&typeof item==='object'){const id=Number(item.id),qty=Number(item.qty||1);return Number.isFinite(id)?{id,qty:qty>0?qty:1}:null}return null}).filter(Boolean)}
    function saveCart(value){localStorage.setItem(CART_KEY,JSON.stringify(value))}
    function getOrders(){const value=readStorage(ORDERS_KEY,[]);return Array.isArray(value)?value:[]}
    function saveOrders(value){localStorage.setItem(ORDERS_KEY,JSON.stringify(value))}
    function showToast(message){const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modal-box"><p>${message}</p><button type="button">حسنا</button></div>`;modal.querySelector('button').onclick=()=>modal.remove();document.body.appendChild(modal)}
    function renderCart(){const products=getProducts(),cart=getCart(),list=document.getElementById('cartList');if(!cart.length){list.innerHTML='<div class="empty">السلة فارغة حاليًا.</div>';document.getElementById('totalPrice').textContent='0 ج.م';return}let total=0;list.innerHTML=cart.map(item=>{const product=products.find(p=>Number(p.id)===Number(item.id));if(!product)return'';const qty=Number(item.qty||1),lineTotal=Number(product.price||0)*qty;total+=lineTotal;return `<div class="cart-item"><img src="${product.image||fallbackImage}" alt="${product.name}" onerror="this.src='${fallbackImage}'"><div><h3 style="margin:0 0 4px">${product.name}</h3><p style="margin:0;color:#6a615d">${product.category||''}</p><div class="qty-box"><button data-action="minus" data-id="${product.id}" type="button">-</button><span>${qty}</span><button data-action="plus" data-id="${product.id}" type="button">+</button></div></div><div><strong>${lineTotal} ج.م</strong><br><button data-action="remove" data-id="${product.id}" type="button" style="margin-top:10px;background:#f5e9e3;color:#6b2e2e;width:auto;padding:8px 12px">حذف</button></div></div>`}).join('');document.getElementById('totalPrice').textContent=total+' ج.م';document.querySelectorAll('[data-action="plus"]').forEach(button=>button.onclick=()=>updateQty(Number(button.dataset.id),1));document.querySelectorAll('[data-action="minus"]').forEach(button=>button.onclick=()=>updateQty(Number(button.dataset.id),-1));document.querySelectorAll('[data-action="remove"]').forEach(button=>button.onclick=()=>removeFromCart(Number(button.dataset.id)))}
    function updateQty(id,delta){const cart=getCart(),products=getProducts(),product=products.find(item=>Number(item.id)===id),current=cart.find(item=>Number(item.id)===id);if(!product||!current)return;const nextQty=Number(current.qty||1)+delta;if(nextQty<=0){removeFromCart(id);return}if(nextQty>product.stock){showToast(`المتاح من هذا المنتج: ${product.stock} قطعة`);return}current.qty=nextQty;saveCart(cart);renderCart()}
    function removeFromCart(id){saveCart(getCart().filter(item=>Number(item.id)!==id));renderCart()}
    document.getElementById('checkoutBtn').onclick=function(){const cart=getCart(),products=getProducts();if(!cart.length){showToast('السلة فارغة');return}const name=document.getElementById('customerName').value.trim(),phone=document.getElementById('customerPhone').value.trim(),address=document.getElementById('customerAddress').value.trim();if(!name){showToast('يرجى إدخال اسم العميل');return}if(!phone){showToast('يرجى إدخال رقم الهاتف');return}if(!address){showToast('يرجى إدخال عنوان التوصيل');return}const lines=[];let total=0;for(const item of cart){const product=products.find(p=>Number(p.id)===Number(item.id)),qty=Number(item.qty||1);if(!product||!Number.isFinite(product.stock)||product.stock<qty){showToast(`المتاح من المنتج غير كافٍ. المتاح الآن: ${product?product.stock:0}`);return}lines.push({id:product.id,name:product.name,price:Number(product.price||0),qty});total+=Number(product.price||0)*qty}for(const item of cart){const product=products.find(p=>Number(p.id)===Number(item.id));product.stock-=Number(item.qty||1)}const order={id:Date.now(),date:new Date().toLocaleString('ar-EG'),status:'جديد',customer:{name,phone,address},items:lines,total};saveProducts(products);saveOrders([...getOrders(),order]);saveCart([]);renderCart();document.getElementById('customerName').value='';document.getElementById('customerPhone').value='';document.getElementById('customerAddress').value='';showToast('تم تسجيل الطلب بنجاح')};
    renderCart();
  </script>
</body>
</html>
