<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السلة | BRAVEN</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f7f4f1;color:#171515}a{color:inherit;text-decoration:none}.header{display:flex;justify-content:space-between;align-items:center;padding:18px 30px;background:#101010;color:#fff}.logo{font-size:2rem;font-weight:900;letter-spacing:1px}.logo small{display:block;font-size:.64rem;letter-spacing:.12em;opacity:.72}.wrap{max-width:1100px;margin:40px auto;padding:0 20px 60px}.panel{background:#fff;border:1px solid #e3dcd3;border-radius:18px;padding:22px}.cart-item{display:grid;grid-template-columns:110px 1fr auto;gap:16px;padding:14px;background:#faf6f2;border:1px solid #e7ded5;border-radius:14px;margin-bottom:12px;align-items:center}.cart-item img{width:110px;height:110px;object-fit:cover;border-radius:12px}.qty-box{display:inline-flex;align-items:center;gap:10px;border:1px solid #ded1c6;border-radius:12px;padding:6px 10px;margin-top:8px}.qty-box button{width:28px;height:28px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700;cursor:pointer}.summary{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:18px;border-top:1px solid #ece2d8}.checkout-btn{border:0;border-radius:12px;padding:12px 22px;background:#111;color:#fff;font-weight:700;cursor:pointer}.empty{padding:28px;text-align:center;border:1px dashed #dcd1c6;border-radius:14px;background:#fffaf5;color:#726a64}@media(max-width:700px){.cart-item{grid-template-columns:90px 1fr}.summary{flex-direction:column;gap:12px;align-items:stretch}}
</style>
</head>
<body>
<header class="header"><a class="logo" href="index.html">♧ BRAVEN<small>CART</small></a><a href="index.html">العودة للمتجر</a></header>
<main class="wrap"><section class="panel"><h2>السلة</h2><div id="cartList"></div><div class="summary"><strong id="totalPrice">0 ج.م</strong><button class="checkout-btn" id="checkoutBtn" type="button">إتمام الشراء</button></div></section></main>
<script>
const PRODUCTS_KEY='braven_products',CART_KEY='braven_cart',ORDERS_KEY='braven_orders';
const fallbackImage='https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=900&q=80';
function read(key, fallback){try{const value=JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback));return value}catch(e){return fallback}}
function getProducts(){const value=read(PRODUCTS_KEY,[]);return Array.isArray(value)?value:[]}
function saveProducts(value){localStorage.setItem(PRODUCTS_KEY,JSON.stringify(value))}
function getCart(){const value=read(CART_KEY,[]);if(!Array.isArray(value))return[];return value.map(item=>{if(typeof item==='number')return{id:Number(item),qty:1};if(item&&typeof item==='object'){const id=Number(item.id),qty=Math.max(1,Number(item.qty)||1);return Number.isFinite(id)?{id,qty}:null}return null}).filter(Boolean)}
function saveCart(value){localStorage.setItem(CART_KEY,JSON.stringify(value));window.dispatchEvent(new Event('braven-cart-updated'))}
function getOrders(){const value=read(ORDERS_KEY,[]);return Array.isArray(value)?value:[]}
function saveOrders(value){localStorage.setItem(ORDERS_KEY,JSON.stringify(value));window.dispatchEvent(new Event('braven-orders-updated'))}
function renderCart(){const products=getProducts(),cart=getCart(),list=document.getElementById('cartList');if(!cart.length){list.innerHTML='<div class="empty">السلة فارغة حاليًا.</div>';document.getElementById('totalPrice').textContent='0 ج.م';return}let total=0;list.innerHTML=cart.map(item=>{const p=products.find(x=>Number(x.id)===item.id);if(!p)return'';const qty=item.qty,line=Number(p.price||0)*qty;total+=line;return `<div class="cart-item"><img src="${p.image||fallbackImage}" alt="${p.name}" onerror="this.src='${fallbackImage}'"><div><h3 style="margin:0 0 4px">${p.name}</h3><p style="margin:0;color:#6a615d">${p.category||''}</p><div class="qty-box"><button data-action="minus" data-id="${p.id}" type="button">-</button><span>${qty}</span><button data-action="plus" data-id="${p.id}" type="button">+</button></div></div><div><strong>${line} ج.م</strong><br><button data-action="remove" data-id="${p.id}" type="button" style="margin-top:10px;background:#f5e9e3;color:#6b2e2e;width:auto;padding:8px 12px">حذف</button></div></div>`}).join('');document.getElementById('totalPrice').textContent=total+' ج.م';document.querySelectorAll('[data-action="plus"]').forEach(b=>b.onclick=()=>updateQty(Number(b.dataset.id),1));document.querySelectorAll('[data-action="minus"]').forEach(b=>b.onclick=()=>updateQty(Number(b.dataset.id),-1));document.querySelectorAll('[data-action="remove"]').forEach(b=>b.onclick=()=>removeFromCart(Number(b.dataset.id)))}
function updateQty(id,delta){const cart=getCart(),products=getProducts(),p=products.find(x=>Number(x.id)===id),item=cart.find(x=>Number(x.id)===id);if(!p||!item)return;const next=item.qty+delta;if(next<=0){removeFromCart(id);return}if(next>Number(p.stock||0)){alert('لا يوجد مخزون كافٍ لهذه الكمية');return}item.qty=next;saveCart(cart);renderCart()}
function removeFromCart(id){saveCart(getCart().filter(x=>Number(x.id)!==id));renderCart()}
document.getElementById('checkoutBtn').onclick=function(){const button=this,cart=getCart(),products=getProducts();if(!cart.length){alert('السلة فارغة');return}const lines=[];let total=0;for(const item of cart){const p=products.find(x=>Number(x.id)===item.id);if(!p||Number(p.stock||0)<item.qty){alert('بعض المنتجات لم تعد متاحة بالمخزون المطلوب');return}lines.push({id:p.id,name:p.name,price:Number(p.price||0),qty:item.qty});total+=Number(p.price||0)*item.qty}button.disabled=true;try{for(const item of cart){const p=products.find(x=>Number(x.id)===item.id);p.stock=Number(p.stock||0)-item.qty}const order={id:Date.now(),date:new Date().toLocaleString('ar-EG'),status:'جديد',items:lines,total};saveProducts(products);saveOrders([...getOrders(),order]);saveCart([]);renderCart();alert('تم تسجيل الطلب بنجاح')}catch(error){console.error(error);alert('تعذر تسجيل الطلب، حاول مرة أخرى')}finally{button.disabled=false}};
renderCart();
</script>
</body></html>
